version: "3.8"

services:
  simfarm-lab:
    build: .
    container_name: simfarm-lab
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/levels"]
      interval: 30s
      timeout: 5s
      retries: 3
