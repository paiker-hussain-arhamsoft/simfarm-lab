# Optional media-stack extension for simfarm-lab.
#
# Duix-Avatar, Wan2.1, Coqui, Chatterbox, InsightFace, DeepFaceLab, FaceSwap,
# Deep-Live-Cam, Wav2Lip, and SadTalker have heavy or conflicting Python
# dependencies, so the GPU-heavy engines run as separate containers orchestrated
# alongside the main app.
#
# Start everything in one command:
#   docker compose -f docker-compose.yml -f docker-compose.media.yml up -d
#
# Notes:
# - Duix, DeepFaceLab, FaceSwap, Deep-Live-Cam, and SadTalker benefit from an
#   NVIDIA GPU and the NVIDIA Container Toolkit. CPU fallbacks are configured
#   where the image supports them.
# - Duix images are ~70 GB; DeepFaceLab, FaceSwap, Deep-Live-Cam, and SadTalker
#   images are also large.
# - InsightFace is pip-installable and runs in the strategic-brain container
#   (build with --build-arg FACE_STACK=insightface or set FACE_STACK=insightface).
# - DeepFaceLab and FaceSwap need a trained workspace before they can one-shot
#   swap; the operator prepares the workspace inside the container and sets the
#   matching *_COMMAND env var.
# - Deep-Live-Cam is one-shot: its container is prebuilt with the required
#   models and the main app execs it through DEEP_LIVE_CAM_COMMAND by default.
# - Wav2Lip is one-shot: its container is prebuilt with the required models
#   and the main app execs it through WAV2LIP_COMMAND by default.
# - SadTalker is a talking-head generator (source image + audio -> video). It
#   runs in a separate container and is called through SADTALKER_COMMAND. The
#   default command uses CPU inference; remove --cpu and add an NVIDIA runtime
#   for GPU inference.
# - VideoRetalking is an audio-based lip-sync / retalking container. It runs in
#   a separate container and is called through VIDEORETALKING_COMMAND. CPU
#   inference is very slow; GPU is strongly recommended.
# - GFPGAN is a face restoration / upscaling container. The main app execs it
#   through GFPGAN_COMMAND. It supports both images and video.

services:
  duix-avatar-tts:
    image: guiji2025/fish-speech-ziming
    container_name: duix-avatar-tts
    restart: unless-stopped
    ports:
      - "18180:8080"
    volumes:
      - brain-data:/code/data
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility,video,display
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: /bin/bash -c "/opt/conda/envs/python310/bin/python3 tools/api_server.py --listen 0.0.0.0:8080"

  duix-avatar-gen-video:
    image: guiji2025/duix.avatar
    container_name: duix-avatar-gen-video
    restart: unless-stopped
    privileged: true
    ports:
      - "8383:8383"
    volumes:
      - brain-data:/code/data
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility,video,display
    shm_size: 8g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: python /code/app_local.py

  deepfacelab:
    image: xychelsea/deepfacelab:latest
    container_name: deepfacelab
    restart: unless-stopped
    runtime: nvidia
    privileged: true
    volumes:
      - brain-data:/data
      - brain-data:/app/data
    environment:
      - DEEPFACELAB_PATH=/usr/local/deepfacelab
      - DEEPFACELAB_WORKSPACE=/data/deepfacelab_workspace
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility,video,display
    shm_size: 8g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: /bin/bash -c "mkdir -p /data/deepfacelab_workspace && echo 'DeepFaceLab workspace ready at /data/deepfacelab_workspace' && tail -f /dev/null"

  faceswap:
    build:
      context: ./services/faceswap
    image: simfarm-lab/faceswap-cpu:latest
    container_name: faceswap
    restart: unless-stopped
    privileged: true
    volumes:
      - brain-data:/data
      - brain-data:/app/data
    environment:
      - FACESWAP_WORKSPACE=/data/faceswap_workspace
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility,video,display
    shm_size: 8g
    command: /bin/bash -c "mkdir -p /data/faceswap_workspace && echo 'FaceSwap workspace ready at /data/faceswap_workspace' && tail -f /dev/null"

  deep-live-cam:
    build:
      context: ./services/deep-live-cam
    image: simfarm-lab/deep-live-cam:latest
    container_name: deep-live-cam
    restart: unless-stopped
    privileged: true
    volumes:
      - brain-data:/data
      - brain-data:/app/data
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility,video,display
      - INSIGHTFACE_HOME=/data/.insightface
    shm_size: 8g
    command: tail -f /dev/null

  wav2lip:
    image: jwduck/wav2lip:latest
    container_name: wav2lip
    restart: unless-stopped
    privileged: true
    volumes:
      - brain-data:/data
      - brain-data:/app/data
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility,video,display
    shm_size: 8g
    command: tail -f /dev/null

  sadtalker:
    build:
      context: ./services/sadtalker
    image: simfarm-lab/sadtalker:latest
    container_name: sadtalker
    restart: unless-stopped
    privileged: true
    volumes:
      - brain-data:/data
      - brain-data:/app/data
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility,video,display
    shm_size: 8g
    command: tail -f /dev/null

  videoretalking:
    build:
      context: ./services/videoretalking
    image: simfarm-lab/videoretalking:latest
    container_name: videoretalking
    restart: unless-stopped
    privileged: true
    volumes:
      - brain-data:/data
      - brain-data:/app/data
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility,video,display
    shm_size: 8g
    command: tail -f /dev/null

  gfpgan:
    build:
      context: ./services/gfpgan
    image: simfarm-lab/gfpgan:latest
    container_name: gfpgan
    restart: unless-stopped
    privileged: true
    volumes:
      - brain-data:/data
      - brain-data:/app/data
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,graphics,utility,video,display
    shm_size: 8g
    command: tail -f /dev/null

  puppeteer:
    build:
      context: ./services/puppeteer
    image: simfarm-lab/puppeteer:latest
    container_name: puppeteer
    restart: unless-stopped
    privileged: true
    volumes:
      - brain-data:/data
      - brain-data:/app/data
    command: tail -f /dev/null

  proxy-rotator:
    image: jadewon/proxy-rotator:latest
    container_name: proxy-rotator
    restart: unless-stopped
    # The rotator needs outbound internet to fetch free proxy lists.
    environment:
      - LISTEN_ADDR=0.0.0.0
      - PROXY_USERNAME=${PROXY_ROTATOR_USERNAME:-admin}
      - PROXY_PASSWORD=${PROXY_ROTATOR_PASSWORD:-secret}
      - PROXY_PORT=3128
      - ADMIN_PORT=8080
      - SOURCES=${PROXY_ROTATOR_SOURCES:-freeproxy}
      - TEST_URL=https://www.cloudflare.com/cdn-cgi/trace
    # Do not expose the proxy port to the host by default; sibling containers
    # reach it on the internal network at http://proxy-rotator:3128.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
      - TZ=${TZ:-UTC}
    # Do not expose the challenge-solver API to the host or internet.
    # strategic-brain reaches it on the internal network at http://flaresolverr:8191.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  openvas:
    image: immauss/openvas:latest
    container_name: openvas
    restart: unless-stopped
    environment:
      - PASSWORD=${OPENVAS_PASSWORD:-admin}
      - USERNAME=${OPENVAS_USERNAME:-admin}
      - TZ=${TZ:-UTC}
    # Web UI on 9392 is not exposed to the host by default. strategic-brain drives
    # scans via gvm-cli inside the container using the OPENVAS_COMMAND hook.
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9392/login/login.html"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s

  zap:
    image: zaproxy/zap-stable:latest
    container_name: zap
    restart: unless-stopped
    # Keep the container alive so strategic-brain can docker-exec scan scripts.
    command: ["/bin/bash", "-c", "while true; do sleep 30; done"]
    environment:
      - ZAP_OPTIONS=-config api.disablekey=true
    volumes:
      - brain-data:/app/data
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "test", "-f", "/zap/zap-baseline.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  gammu:
    build:
      context: ./services/gammu
    container_name: gammu
    restart: unless-stopped
    # Keep the container alive so strategic-brain can docker exec into it.
    command: ["/bin/bash", "-c", "while true; do sleep 30; done"]
    environment:
      - GAMMU_CONFIG=/etc/gammu/gammurc
    # Uncomment and set the host modem device path to enable real GSM hardware.
    # devices:
    #   - /dev/ttyUSB0:/dev/mobile
    healthcheck:
      test: ["CMD", "gammu", "-c", "/etc/gammu/gammurc", "--help"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  verboice-db:
    image: mysql:5.7
    container_name: verboice-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=verboice
      - MYSQL_DATABASE=verboice
      - MYSQL_USER=verboice
      - MYSQL_PASSWORD=verboice
    volumes:
      - brain-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uverboice", "-pverboice", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  verboice:
    build:
      context: ./services/verboice
    container_name: verboice
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql2://verboice:verboice@verboice-db:3306/verboice?reconnect=true
      - RAILS_ENV=production
      - SECRET_KEY_BASE=${VERBOICE_SECRET_KEY_BASE:-change-me-verboice-secret}
      - VERBOICE_CHANNEL=${VERBOICE_CHANNEL:-}
    depends_on:
      verboice-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-u", "admin@lab.local:admin123", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  elizaos:
    build:
      context: ./services/elizaos
    container_name: elizaos
    restart: unless-stopped
    environment:
      - SERVER_PORT=3000
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ELEVENLABS_XI_API_KEY=${ELEVENLABS_XI_API_KEY:-}
      - ELEVENLABS_MODEL_ID=${ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
    # ElizaOS API is not exposed to the host; strategic-brain calls it internally.
    volumes:
      - brain-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/server/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  botpress:
    image: botpress/server:latest
    container_name: botpress
    restart: unless-stopped
    environment:
      - BP_HOST=0.0.0.0
      - PORT=3000
      - NODE_ENV=production
      # Optional external DB. For a quick lab, Botpress uses SQLite in its data volume.
      - DATABASE=postgres
      - DATABASE_URL=${DATABASE_URL:-sqlite:///botpress/data/db.sqlite}
      - EXTERNAL_URL=${BOTPRESS_EXTERNAL_URL:-http://localhost:3000}
      - BP_LICENSE_KEY=${BOTPRESS_LICENSE_KEY:-}
    volumes:
      - brain-data:/botpress/data
    # Not exposed to the host; strategic-brain calls it on the internal network.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  strategic-brain:
    build:
      context: .
      args:
        FACE_STACK: ${FACE_STACK:-}
        BROWSER_STACK: ${BROWSER_STACK:-all}
    environment:
      - DUIX_VIDEO_HOST=http://duix-avatar-gen-video:8383
      - DUIX_DATA_DIR=/code/data
      - INSIGHTFACE_HOME=${INSIGHTFACE_HOME:-/opt/insightface}
      # Default one-shot Deep-Live-Cam command. The strategic-brain container
      # mounts the host Docker socket so it can exec sibling media containers.
      - DEEP_LIVE_CAM_COMMAND=docker exec deep-live-cam python3 /app/run.py -s {source} -t {target} -o {output} --execution-provider cpu --frame-processor face_swapper
      # Default one-shot Wav2Lip command. The container is prebuilt with models.
      - WAV2LIP_COMMAND=docker exec wav2lip python /workspace/wav2lip/inference.py --checkpoint_path /workspace/wav2lip/checkpoints/wav2lip_gan.pth --face {video} --audio {audio} --outfile {output}
      # Default SadTalker talking-head command. Runs on CPU by default; remove
      # --cpu and add an NVIDIA runtime to the sadtalker service for GPU.
      - SADTALKER_COMMAND=docker exec sadtalker /app/SadTalker/run_sadtalker.sh --driven_audio {audio} --source_image {video} --output {output}
      # Default VideoRetalking lip-sync command. CPU inference is very slow;
      # add an NVIDIA runtime to the videoretalking service for GPU.
      - VIDEORETALKING_COMMAND=docker exec videoretalking /video-retalking/run_videoretalking.sh --face {video} --audio {audio} --output {output}
      # Allow browser automation to visit remote URLs when explicitly enabled.
      - ALLOW_ONLINE_TOOLS=${ALLOW_ONLINE_TOOLS:-}
      # Rotating proxy endpoint. Browser automation and HTTP clients can use this.
      - PROXY_ROTATOR_URL=http://${PROXY_ROTATOR_USERNAME:-admin}:${PROXY_ROTATOR_PASSWORD:-secret}@proxy-rotator:3128
      - PROXY_ROTATOR_API=http://proxy-rotator:8080
      # FlareSolverr challenge solver endpoint. The service runs on the internal network.
      - FLARESOLVERR_URL=http://flaresolverr:8191
      # Comma-separated list of authorized Nmap targets. Defaults to localhost; expand
      # this to owned/authorized assets before calling nmap_scan against them.
      - NMAP_AUTHORIZED_TARGETS=${NMAP_AUTHORIZED_TARGETS:-127.0.0.1,localhost,::1}
      # OpenVAS / GVM credentials. The password is set by the OpenVAS container's PASSWORD env.
      - OPENVAS_USERNAME=${OPENVAS_USERNAME:-admin}
      - OPENVAS_PASSWORD=${OPENVAS_PASSWORD:-admin}
      - OPENVAS_AUTHORIZED_TARGETS=${OPENVAS_AUTHORIZED_TARGETS:-127.0.0.1,localhost,::1}
      # Default OpenVAS command. Runs gvm-cli inside the openvas container.
      - OPENVAS_COMMAND=docker exec openvas gvm-cli socket --gmp-username {username} --gmp-password {password} --xml {xml}
      # OWASP ZAP settings. Add authorized web-app targets to ZAP_AUTHORIZED_TARGETS.
      - ZAP_AUTHORIZED_TARGETS=${ZAP_AUTHORIZED_TARGETS:-http://localhost,http://127.0.0.1}
      # Default ZAP command. Runs zap-baseline.py inside the zap container. Use {script}, {target}, {mins}, {report}.
      - ZAP_COMMAND=docker exec zap python3 {script} -t {target} -m {mins} -J {report} -I
      # ElizaOS persona/agent API endpoint. The elizaos container runs the eliza-starter API.
      - ELIZAOS_URL=http://elizaos:3000
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Botpress persona/bot API endpoint. The botpress container runs botpress/server.
      - BOTPRESS_URL=http://botpress:3000
      - BOTPRESS_TOKEN=${BOTPRESS_TOKEN:-}
      - BOTPRESS_WORKSPACE_ID=${BOTPRESS_WORKSPACE_ID:-}
      # Browserbase cloud browser / proxy credentials. Set BROWSERBASE_API_KEY in your .env.
      - BROWSERBASE_API_KEY=${BROWSERBASE_API_KEY:-}
      - BROWSERBASE_PROJECT_ID=${BROWSERBASE_PROJECT_ID:-}
      # Default Puppeteer command. The puppeteer container mounts brain-data and runs
      # a Node wrapper around the official puppeteer package.
      - PUPPETEER_COMMAND=docker exec puppeteer node /app/run_puppeteer.js --target {target} --action {action} --script {script} --selector {selector} --value {value} --headless {headless} --screenshot {screenshot} --output {output} --browser {browser} --proxy {proxy}
      # Default GFPGAN face restoration/upscale command. Supports images and video.
      - GFPGAN_COMMAND=docker exec gfpgan python3 /app/gfpgan/run_gfpgan.py --input {input} --output {output} --scale {scale}
      # Socioboard fleet orchestration command hook. Set this to a script that calls your Socioboard API.
      - SOCIOBOARD_COMMAND=${SOCIOBOARD_COMMAND:-}
      - SOCIOBOARD_URL=${SOCIOBOARD_URL:-}
      - SOCIOBOARD_API_KEY=${SOCIOBOARD_API_KEY:-}
      # GSM/SMS/IVR command hooks. Set these to scripts that call Gammu, SMSgate, RASP-IVR, Verboice, or VBVoice.
      # Defaults below target the sibling `gammu` container built from ./services/gammu.
      - GAMMU_COMMAND=${GAMMU_COMMAND:-docker exec gammu gammu -c /etc/gammu/gammurc {command}}
      - SMSGATE_COMMAND=${SMSGATE_COMMAND:-docker exec gammu gammu -c /etc/gammu/gammurc sendsms TEXT {to} -text \"{body}\"}
      - RASP_IVR_COMMAND=${RASP_IVR_COMMAND:-}
      - VERBOICE_COMMAND=${VERBOICE_COMMAND:-docker exec verboice bundle exec ruby /usr/local/bin/verboice_tool.rb {action} '{scenario}' '{objective}' '{tasks}' '{schedule}'}
      - VBVOICE_COMMAND=${VBVOICE_COMMAND:-}
    volumes:
      - brain-data:/code/data
      - brain-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
